<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Status</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

<div class="container">

    <h2>Queue Status</h2>

    <table>

        <thead>
        <tr>
            <th>Token</th>
            <th>Name</th>
            <th>Service</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody id="statusData"></tbody>

    </table>

</div>

<script>

function renderStatuses(){

let tokens = JSON.parse(localStorage.getItem("tokens")) || [];
let output = "";

tokens.forEach(function(t){

    output += `
        <tr>
            <td>${t.token}</td>
            <td>${t.name}</td>
            <td>${t.service}</td>
            <td>${t.status}</td>
        </tr>
    `;

});

document.getElementById("statusData").innerHTML = output || `
    <tr>
        <td colspan="4">No queue tokens available.</td>
    </tr>
`;

}

renderStatuses();

window.addEventListener("storage", renderStatuses);

</script>

</body>
</html>
